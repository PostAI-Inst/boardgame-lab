name: Validate print-and-play assets
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate asset counts and file signatures
        run: python3 games/fut100k/scripts/validate_repo.py
