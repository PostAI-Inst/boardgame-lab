name: Validate games and print-and-play assets
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate asset counts and file signatures
        run: python3 games/fut100k/scripts/validate_repo.py
  narrative-game:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify story graphs, endings, gates and saves
        working-directory: games/postai-rules
        run: npm test
